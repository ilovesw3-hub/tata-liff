<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TATA - บันทึกรายจ่าย</title>
  
  <!-- โหลดฟอนต์สไตล์ใบเสร็จ/ตั๋ว -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    :root {
      --bg-color: #EAE6DF;
      --ticket-bg: #FBF7F0;
      --text-main: #1B2430;
      --cny-green: #1F6F5C;
      --thb-orange: #C97D2E;
      --border-light: #D9D2C5;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* โครงสร้างตั๋ว/ใบเสร็จ */
    .ticket {
      background-color: var(--ticket-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ส่วนหัว (Profile) */
    .header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .profile-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #ddd;
      object-fit: cover;
    }
    .profile-info {
      flex: 1;
    }
    .profile-title {
      font-size: 12px;
      color: #666;
      margin: 0 0 2px 0;
    }
    .profile-name {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    /* รอยปรุตั๋ว */
    .perforation {
      height: 0;
      border-bottom: 2px dashed var(--border-light);
      position: relative;
    }
    .perforation::before, .perforation::after {
      content: '';
      position: absolute;
      top: -10px;
      width: 20px;
      height: 20px;
      background-color: var(--bg-color);
      border-radius: 50%;
    }
    .perforation::before { left: -10px; }
    .perforation::after { right: -10px; }

    /* ส่วนฟอร์ม */
    .form-body {
      padding: 24px 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #555;
    }

    /* ยอดเงินและสกุลเงิน */
    .amount-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .amount-input {
      flex: 1;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 600;
      padding: 8px 0;
      border: none;
      border-bottom: 2px solid var(--text-main);
      background: transparent;
      color: var(--text-main);
      text-align: right;
      outline: none;
    }
    .amount-input::placeholder { color: #ccc; }
    
    .currency-btn {
      padding: 10px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .currency-cny { background-color: var(--cny-green); }
    .currency-thb { background-color: var(--thb-orange); }

    /* Input ทั่วไป */
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      background-color: white;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--cny-green);
    }

    /* Radio Buttons (Split Type) */
    .split-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    .radio-label input { margin-right: 12px; accent-color: var(--cny-green); }
    .radio-label.selected {
      border-color: var(--cny-green);
      background-color: #EAF3F1;
    }
    .split-desc {
      font-size: 12px;
      color: #666;
      margin-left: auto;
    }

    /* Checkbox สมาชิก (Custom Split) */
    #memberBox {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.5);
      border-radius: 8px;
      border: 1px dashed var(--border-light);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
    }
    .checkbox-label input { margin-right: 10px; accent-color: var(--cny-green); }

    /* ปุ่ม Action */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-cancel {
      background-color: transparent;
      color: #666;
      border: 1px solid #ccc;
    }
    .btn-save {
      background-color: var(--cny-green);
      color: white;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Loading Overlay */
    #loadingOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(251, 247, 240, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 12px;
    }
    .spinner {
      border: 3px solid var(--border-light);
      border-top: 3px solid var(--cny-green);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="ticket">
    <!-- หน้าจอ Loading ปิดทับก่อนโหลดข้อมูลเสร็จ -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div id="loadingText" style="font-size: 14px; color: #555;">กำลังเตรียมตั๋ว...</div>
    </div>

    <div class="header">
      <img id="profileImg" class="profile-img" src="" alt="Profile">
      <div class="profile-info">
        <p class="profile-title">ผู้จ่ายเงิน (Payer)</p>
        <p id="profileName" class="profile-name">กำลังโหลด...</p>
      </div>
      <div id="tripCodeBadge" style="font-family: 'IBM Plex Mono'; font-size: 12px; color: #888; text-align: right;"></div>
    </div>

    <div class="perforation"></div>

    <div class="form-body">
      <!-- 1. ยอดเงิน -->
      <div class="form-group">
        <label class="label">ยอดเงิน (Amount)</label>
        <div class="amount-group">
          <input type="number" id="amountInput" class="amount-input" placeholder="0.00" inputmode="decimal">
          <button type="button" id="currencyBtn" class="currency-btn currency-cny" data-currency="CNY">CNY</button>
        </div>
      </div>

      <!-- 2. หมวดหมู่ -->
      <div class="form-group">
        <label class="label">หมวดหมู่ (Category)</label>
        <input type="text" id="categoryInput" list="categories" placeholder="เลือกหรือพิมพ์หมวดหมู่">
        <datalist id="categories">
          <option value="อาหาร">
          <option value="ตั๋วเครื่องบิน">
          <option value="โรงแรม">
          <option value="เดินทาง (แท็กซี่/รถไฟ)">
          <option value="ค่าเข้าสถานที่">
          <option value="ของฝาก/ช้อปปิ้ง">
          <option value="ค่าซิม/เน็ต">
          <option value="ค่าประกันเดินทาง">
        </datalist>
      </div>

      <!-- 3. รูปแบบการหาร -->
      <div class="form-group">
        <label class="label">รูปแบบการหาร (Split Type)</label>
        <div class="split-options">
          <label class="radio-label selected">
            <input type="radio" name="splitType" value="equal" checked> 
            <span>หารกองกลาง</span>
            <span class="split-desc">หารทุกคน</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="splitType" value="none"> 
            <span>จ่ายส่วนตัว</span>
            <span class="split-desc">ไม่หาร</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="splitType" value="custom"> 
            <span>ระบุคนหารเอง</span>
            <span class="split-desc">Custom</span>
          </label>
        </div>

        <!-- รายชื่อลูกทริป (ซ่อนไว้ โชว์เมื่อเลือก Custom) -->
        <div id="memberBox">
          <div style="font-size: 12px; color: #666; margin-bottom: 8px;">ติ๊กเลือกคนที่จะหารบิลก้อนนี้ด้วย:</div>
          <div id="memberCheckboxes"></div>
        </div>
      </div>

      <!-- 4. หมายเหตุ -->
      <div class="form-group">
        <label class="label">หมายเหตุ (Note - ไม่บังคับ)</label>
        <input type="text" id="noteInput" placeholder="เช่น ค่าแท็กซี่ไปเดอะบันด์">
      </div>

      <!-- ปุ่ม Action -->
      <div class="actions">
        <button type="button" class="btn btn-cancel" id="cancelBtn">ยกเลิก</button>
        <button type="button" class="btn btn-save" id="saveBtn">บันทึกบิล</button>
      </div>
    </div>
  </div>

  <script>
    // --- ตั้งค่าระบบ ---
    const LIFF_ID = "2011511627-13L1YyxX";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzp2u97HyICryTxHwEVdAdxk5dYt8wvfiCUSOf1LP5JC6q6e3Y1v6Yx8FzlNQ3tyITE/exec";

    let myUid = null;
    let tripMembers = [];

    // --- อ้างอิง UI Elements ---
    const overlay = document.getElementById("loadingOverlay");
    const loadingText = document.getElementById("loadingText");
    const currencyBtn = document.getElementById("currencyBtn");
    const radioLabels = document.querySelectorAll(".radio-label");
    const splitRadios = document.getElementsByName("splitType");
    const memberBox = document.getElementById("memberBox");
    const memberCheckboxes = document.getElementById("memberCheckboxes");
    
    // --- ฟังก์ชันหลักตอนเปิดหน้าเว็บ ---
    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        myUid = profile.userId;
        document.getElementById("profileName").innerText = profile.displayName;
        if(profile.pictureUrl) {
          document.getElementById("profileImg").src = profile.pictureUrl;
        }

        loadingText.innerText = "กำลังดึงข้อมูลทริป...";
        await fetchTripContext();

      } catch (err) {
        showError("โหลดข้อมูลล้มเหลว: " + err.message);
      }
    }

    // --- ดึงข้อมูลทริปจาก GAS ---
    async function fetchTripContext() {
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "get_trip_context", uid: myUid })
        });
        const data = await res.json();

        if (data.status === "ok") {
          document.getElementById("tripCodeBadge").innerText = data.tripCode;
          tripMembers = data.members;
          
          // Auto-set Currency ตาม Phase
          if (data.phase === 'pre-trip') {
            toggleCurrency('THB');
          } else {
            toggleCurrency('CNY');
          }

          renderMemberCheckboxes();
          overlay.style.display = "none"; // ปิดหน้า Loading
        } else {
          showError("ข้อผิดพลาด: " + (data.message === "no_trip_joined" ? "คุณยังไม่ได้พิมพ์ JOIN ทริปในแชท" : data.message));
        }
      } catch (err) {
        showError("เชื่อมต่อฐานข้อมูลล้มเหลว");
      }
    }

    // --- วาด Checkbox สมาชิก ---
    function renderMemberCheckboxes() {
      memberCheckboxes.innerHTML = "";
      tripMembers.forEach(m => {
        const isMe = m.uid === myUid;
        const label = document.createElement("label");
        label.className = "checkbox-label";
        label.innerHTML = `
          <input type="checkbox" value="${m.uid}" checked> 
          ${m.name} ${isMe ? "(คุณ/ผู้จ่าย)" : ""}
        `;
        memberCheckboxes.appendChild(label);
      });
    }

    // --- UI Interactions ---

    // 1. สลับสกุลเงิน
    currencyBtn.addEventListener("click", () => {
      const current = currencyBtn.getAttribute("data-currency");
      toggleCurrency(current === "CNY" ? "THB" : "CNY");
    });

    function toggleCurrency(target) {
      if (target === "THB") {
        currencyBtn.innerText = "THB";
        currencyBtn.setAttribute("data-currency", "THB");
        currencyBtn.className = "currency-btn currency-thb";
      } else {
        currencyBtn.innerText = "CNY";
        currencyBtn.setAttribute("data-currency", "CNY");
        currencyBtn.className = "currency-btn currency-cny";
      }
    }

    // 2. ไฮไลต์ปุ่ม Radio และโชว์/ซ่อน Checkbox
    splitRadios.forEach(radio => {
      radio.addEventListener("change", function() {
        radioLabels.forEach(lbl => lbl.classList.remove("selected"));
        this.closest(".radio-label").classList.add("selected");
        
        if (this.value === "custom") {
          memberBox.style.display = "block";
        } else {
          memberBox.style.display = "none";
        }
      });
    });

    // 3. ปิดหน้าจอ
    document.getElementById("cancelBtn").addEventListener("click", () => {
      liff.closeWindow();
    });

    // 4. กดบันทึกบิล (Submit)
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const amount = Number(document.getElementById("amountInput").value);
      const currency = currencyBtn.getAttribute("data-currency");
      const category = document.getElementById("categoryInput").value.trim();
      const note = document.getElementById("noteInput").value.trim();
      
      const splitType = document.querySelector('input[name="splitType"]:checked').value;
      const checkedMembers = Array.from(document.querySelectorAll("#memberCheckboxes input:checked")).map(el => el.value);

      // Validate เบื้องต้น
      if (!amount || amount <= 0) {
        alert("กรุณากรอกยอดเงินให้ถูกต้องครับ");
        return;
      }
      if (!category) {
        alert("กรุณาระบุหมวดหมู่ค่าใช้จ่ายด้วยครับ");
        return;
      }
      if (splitType === "custom" && checkedMembers.length === 0) {
        alert("กรุณาเลือกคนหารอย่างน้อย 1 คนครับ");
        return;
      }

      // เปิดหน้า Loading ตอนบันทึก
      loadingText.innerText = "กำลังบันทึกบิล...";
      overlay.style.display = "flex";

      const payload = {
        action: "liff_expense",
        uid: myUid,
        amount: amount,
        currency: currency,
        category: category,
        note: note,
        splitType: splitType,
        splitMembers: checkedMembers
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === "ok") {
          alert("บันทึกรายจ่ายสำเร็จ!");
          liff.closeWindow();
        } else {
          showError("บันทึกไม่สำเร็จ: " + data.message);
        }
      } catch (err) {
        showError("เกิดข้อผิดพลาดในการส่งข้อมูล");
      }
    });

    function showError(msg) {
      alert(msg);
      overlay.style.display = "none";
    }

    // เริ่มทำงานเมื่อเปิดหน้า
    main();
  </script>
</body>
</html>
